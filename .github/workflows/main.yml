name: Build Next.js to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      # STEP BARU: Bina web & paksa masukkan kod langgar kamera (viewport-fit=cover)
      - name: Build Next.js & Force Viewport
        run: |
          npm run build
          # Bot akan cari semua fail HTML dan paksa letak kod ni supaya webview tak segan-segan langgar notch
          find out -type f -name "*.html" -exec sed -i 's/<\/head>/<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" \/><\/head>/g' {} +

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init VisualEngine com.visualengine.app --web-dir out
          
          npx cap add android || true
          npx cap sync android
          
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      # STEP BARU: JAVA MODEN (API 30+) UNTUK ANDROID TERKINI
      - name: Force Landscape & Modern Immersive Mode
        run: |
          cd android
          
          sed -i 's/android:name="MainActivity"/android:name="MainActivity" android:screenOrientation="sensorLandscape"/g' app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > app/src/main/java/com/visualengine/app/MainActivity.java
          package com.visualengine.app;

          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  Window window = getWindow();
                  
                  // 1. Paksa masuk kawasan Notch/Lubang Kamera
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.P) {
                      window.getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  
                  // 2. Kod Android Moden untuk sapu bersih Status Bar & Navigation Bar
                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  WindowInsetsControllerCompat insetsController = WindowCompat.getInsetsController(window, window.getDecorView());
                  if (insetsController != null) {
                      insetsController.hide(WindowInsetsCompat.Type.systemBars());
                      insetsController.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              }
          }
          EOF

      - name: Fix Kotlin Conflict & Build APK
        run: |
          cd android
          
          echo "
          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  def requested = details.requested
                  if (requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          " >> app/build.gradle
          
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualEngine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
