name: Build Next.js to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Next.js (Static Export)
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Perhatikan aku dah buang 'Setup Android SDK' kat sini supaya tak conflict

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init VisualEngine com.visualengine.app --web-dir out
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Kita tambah arahan 'clean' dan '--stacktrace'
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisualEngine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
