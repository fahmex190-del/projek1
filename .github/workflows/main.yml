name: Build Next.js to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Capacitor Plugins
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/status-bar
          npm install -D @capacitor/cli

      - name: Build Next.js & Paksa Viewport HTML
        run: |
          npm run build
          # Memastikan HTML menggunakan viewport-fit=cover untuk skrin penuh bawah notch
          find out -type f -name "*.html" -exec sed -i 's/<head>/<head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" \/>/g' {} +

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cipta Capacitor Config Khas
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.visualengine.app",
            "appName": "VisualEngine",
            "webDir": "out",
            "plugins": {
              "StatusBar": {
                "hidden": true
              }
            }
          }
          EOF

      - name: Configure Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Tulis Semula Tema Android & MainActivity
        run: |
          cd android
          # Paksa Landscape
          sed -i 's/android:name="MainActivity"/android:name="MainActivity" android:screenOrientation="sensorLandscape"/g' app/src/main/AndroidManifest.xml
          
          # Tulis Semula styles.xml (Hilangkan ActionBar & Set Fullscreen)
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF

          # KOD TERBARU: Sembunyikan Ikon Status Bar (Jam/Bateri) secara total
          cat << 'EOF' > app/src/main/java/com/visualengine/app/MainActivity.java
          package com.visualengine.app;

          import android.os.Bundle;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.os.Build;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Benarkan aplikasi guna ruang bawah notch kamera
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }

                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      // Cara Moden untuk Android 11 ke atas (Sembunyikan ikon jam/bateri)
                      final WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      // Cara Legacy untuk Android lama
                      getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                      getWindow().getDecorView().setSystemUiVisibility(
                          android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                  }
              }
          }
          EOF

      - name: Fix Kotlin & Build APK
        run: |
          cd android
          echo "configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> app/build.gradle
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisualEngine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
